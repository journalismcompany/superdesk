services:

  mongodb:
    image: mongo:4
    networks:
      - superdesk
    expose:
      - "27017"

  redis:
    image: redis:3
    networks:
      - superdesk
    expose:
      - "6379"

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.1
    environment:
      - discovery.type=single-node
    networks:
      - superdesk
    expose:
      - "9200"

  superdesk-server:
    image: sourcefabricoss/superdesk-server:latest
    build: ./server
    depends_on:
      - redis
      - mongodb
      - elastic
    environment:
      - SUPERDESK_URL=http://superdesk-client/api
      - DEMO_DATA=1
      - WEB_CONCURRENCY=2
      - SUPERDESK_CLIENT_URL=http://superdesk-client
      - CONTENTAPI_URL=http://superdesk-client/capi
      - MONGO_URI=mongodb://mongodb/superdesk
      - CONTENTAPI_MONGO_URI=mongodb://mongodb/superdesk_capi
      - PUBLICAPI_MONGO_URI=mongodb://mongodb/superdesk_papi
      - LEGAL_ARCHIVE_URI=mongodb://mongodb/superdesk_legal
      - ARCHIVED_URI=mongodb://mongodb/superdesk_archive
      - ELASTICSEARCH_URL=http://elastic:9200
      - ELASTICSEARCH_INDEX=superdesk
      - CELERY_BROKER_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/1
      - DEFAULT_TIMEZONE=Europe/Prague
      - SECRET_KEY=*k^&9)byk=8en9n1sg7-xj4f8wr2mh^x#t%_2=1=z@69oxt50!
    networks:
      - superdesk
      - superdesk-newsroom

  superdesk-client:
    image: sourcefabricoss/superdesk-client:latest
    build: ./client
    environment:
      - SUPERDESK_URL=http://superdesk-server:8080/api
      - SUPERDESK_WS_URL=ws://superdesk-server:8080/ws
      - IFRAMELY_KEY
    ports:
      - "8081:80"
    networks:
      - superdesk

networks:
    superdesk:
        driver: bridge
    superdesk-newsroom:
        name: superdesk-newsroom
